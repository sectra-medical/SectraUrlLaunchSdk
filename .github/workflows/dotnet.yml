# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the code
    - uses: actions/checkout@v7

    # Step 2: Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # Step 3: Build and test the SDK
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    # The net48 tests run in the test-netframework job: VSTest no longer runs
    # .NET Framework tests on Linux (Mono support was removed).
    - name: Test
      run: dotnet test --no-build --framework net10.0 --verbosity normal

    # Step 4: Integration test the SDK
    - name: Integration test
      run: ./scripts/IntegrationTestRunner.sh

    # Step 5: Package the SDK
    - name: Pack
      run: dotnet pack --configuration Release -o ./artifacts

    # Step 6: Upload
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: NuGet
        path: ./artifacts
        retention-days: 5

  test-netframework:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --framework net48 --verbosity normal
